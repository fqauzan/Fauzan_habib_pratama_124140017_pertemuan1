<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Mini POS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Kasir Mini POS</h1>
            <p>Aplikasi Kasir & Keranjang Belanja Sederhana</p>
        </header>

        <!-- FORM INPUT BARANG -->
        <section class="card">

            <h2>Input Barang</h2>

            <form id="formBarang">

                <div class="form-group">
                    <label for="namaBarang">Nama Barang</label>
                    <input type="text" id="namaBarang" placeholder="Contoh: Buku Tulis">
                    <small id="errorNama" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="hargaBarang">Harga Satuan</label>
                    <input type="number" id="hargaBarang" placeholder="Minimal Rp500">
                    <small id="errorHarga" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="qtyBarang">Jumlah / Qty</label>
                    <input type="number" id="qtyBarang" placeholder="Minimal 1">
                    <small id="errorQty" class="error"></small>
                </div>

                <button type="submit" class="btn-primary">
                    Tambah ke Keranjang
                </button>

            </form>

        </section>


        <!-- KERANJANG -->
        <section class="card">

            <h2>Keranjang Belanja</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Barang</th>
                            <th>Harga Satuan</th>
                            <th>Qty</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelKeranjang">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- PERHITUNGAN -->
        <section class="card">

            <h2>Ringkasan Pembayaran</h2>

            <div class="summary">

                <div>
                    <span>Total Belanja</span>
                    <strong id="totalBelanja">Rp0</strong>
                </div>

                <div>
                    <span>Diskon</span>
                    <strong id="nominalDiskon">Rp0</strong>
                </div>

                <div>
                    <span>Total Akhir</span>
                    <strong id="totalAkhir">Rp0</strong>
                </div>

            </div>


            <div class="promo">

                <label for="kodePromo">Kode Promo</label>

                <div class="promo-input">
                    <input
                        type="text"
                        id="kodePromo"
                        placeholder="Contoh: HEMAT10"
                    >

                    <button type="button" id="btnPromo">
                        Gunakan
                    </button>
                </div>

                <small id="pesanPromo"></small>

            </div>


            <div class="payment">

                <label for="uangBayar">Uang Bayar</label>

                <input
                    type="number"
                    id="uangBayar"
                    placeholder="Masukkan nominal uang"
                >

                <p id="pesanPembayaran"></p>

                <div class="kembalian">
                    <span>Kembalian</span>
                    <strong id="kembalian">Rp0</strong>
                </div>

            </div>


            <button
                type="button"
                id="btnTransaksi"
                class="btn-danger"
            >
                Transaksi Baru / Reset
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
